name: Rebuild ratings site

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours; current season data is always re-fetched
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # historical years never change, so cache data/ to skip re-downloading ~1.2GB every run.
      # the current season's files are always re-fetched on top of the cache (fetch_data.py forces it).
      - uses: actions/cache@v4
        with:
          path: data
          key: cfb-data-v1

      - run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: src
        env:
          CFBD_API_KEY: ${{ secrets.CFBAPI }}
          OMP_NUM_THREADS: "1"   # the walk forward runs one process per season; threaded numpy on top oversubscribes the cores
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python3 fetch_data.py   # season comes from src/season.py
          python3 prep.py
          python3 run_bt.py
          python3 pregame.py
          python3 test_analogs.py   # look-ahead check on the matchup fingerprints; a failure stops the deploy
          python3 export2.py
          python3 export3.py
          python3 qb.py   # quarterback context for this season's teams
          python3 players.py   # player game logs for props on game pages
          python3 lines.py
          python3 kalshi.py
          python3 kalshi_flags.py   # appends each new Kalshi opportunity, frozen with its inputs, to kalshi_flags.jsonl
          python3 track.py   # logs new openers with the model's number to tracking.jsonl (forward test)
          python3 preseason.py
          python3 build_page.py

      - name: Forward logs are append only
        # tracking.jsonl, kalshi_history.jsonl and kalshi_flags.jsonl are forward tests: a rebuild may only add lines,
        # never change or drop one, and every new line must come from this run (see src/check_logs.py).
        run: python3 src/check_logs.py

      - name: Commit updated page and odds history if changed
        run: |
          git config user.name "gtr-bot"
          git config user.email "gtr-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- gridiron-t-rank.html kalshi_history.jsonl tracking.jsonl kalshi_flags.jsonl data/preseason.json data/lines_hist.json)" ]; then
            git add gridiron-t-rank.html kalshi_history.jsonl tracking.jsonl kalshi_flags.jsonl data/preseason.json data/lines_hist.json
            git commit -m "Automated rebuild with latest data"
            # a code push can land while this run is going; replay this data commit on top of it.
            # Generated files can conflict: keep this run's fresh copies (the forward logs merge by union, see .gitattributes).
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              git checkout --theirs -- gridiron-t-rank.html data/preseason.json data/lines_hist.json
              git add gridiron-t-rank.html data/preseason.json data/lines_hist.json kalshi_history.jsonl tracking.jsonl kalshi_flags.jsonl
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          else
            echo "No changes, skipping commit"
          fi

      - name: Stage just the page for Pages
        run: |
          mkdir -p public
          cp gridiron-t-rank.html public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
